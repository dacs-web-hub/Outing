<div style="width: 100%; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; box-sizing: border-box; background: #1a1a1a;">
  <div style="width: 100%; max-width: 380px;">
    <div style="background: linear-gradient(135deg, #2d2d2d 0%, #3a3a3a 100%); border-radius: 12px; border: 2px solid #5a9fd4; padding: 2rem 1.5rem; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.4);">
      
      <div style="margin-bottom: 1.5rem;">
        <div style="font-size: 48px; margin-bottom: 0.75rem;">🎉</div>
        <h1 style="font-size: 28px; font-weight: 500; margin: 0 0 0.5rem; color: #ffffff;">You're Invited!</h1>
        <p style="font-size: 14px; color: #5a9fd4; margin: 0; font-weight: 500;">Team Building Outing</p>
      </div>

      <div style="background: #252525; border-radius: 8px; padding: 1.25rem; margin: 1.5rem 0; text-align: left; border-left: 4px solid #5a9fd4;">
        <p style="font-size: 14px; color: #e0e0e0; margin: 0 0 1rem; line-height: 1.6;">
          Join us for an unforgettable day of team bonding, laughter, and fun!
        </p>
        <p style="font-size: 13px; color: #b0b0b0; margin: 0; line-height: 1.8;">
          <strong>📅 Date:</strong> August 30, 2026<br/>
          <strong>📍 Location:</strong> Rockwall Bayside Resort
        </p>
      </div>

      <p style="font-size: 14px; color: #b0b0b0; margin: 1.5rem 0 1.75rem;">
        Can you make it?
      </p>

      <div style="display: flex; gap: 12px; margin-top: 2rem; position: relative; min-height: 50px;">
        <button id="noBtn" style="flex: 1; padding: 14px 16px; background: #3a3a3a; border: 1px solid #555555; border-radius: 6px; font-size: 14px; font-weight: 500; color: #e0e0e0; cursor: pointer; transition: all 0.2s ease; white-space: nowrap; touch-action: manipulation;">No, I'm good</button>
        
        <button id="yesBtn" style="flex: 1; padding: 14px 16px; background: #5a9fd4; border: 1px solid #5a9fd4; border-radius: 6px; font-size: 14px; font-weight: 500; color: white; cursor: pointer; position: relative; transition: all 0.15s ease; white-space: nowrap; touch-action: manipulation;">Yes! Count me in</button>
      </div>

      <p id="message" style="font-size: 13px; color: #b0b0b0; margin-top: 1rem; min-height: 20px;"></p>
    </div>
  </div>
</div>

<script>
const yesBtn = document.getElementById('yesBtn');
const noBtn = document.getElementById('noBtn');
const message = document.getElementById('message');

let clickCount = 0;
const funMessages = [
  "You can't run from fun forever!",
  "Getting faster, are we?",
  "Nice try! 😏",
  "I'm just warming up...",
  "Did you really think that would work?",
  "C'mon, you know you want to! 🎉",
  "This is getting embarrassing for you...",
  "Okay, I'll stand still... just kidding!",
];

// Detect if device is mobile/touch
const isTouchDevice = () => {
  return (('ontouchstart' in window) ||
          (navigator.maxTouchPoints > 0) ||
          (navigator.msMaxTouchPoints > 0));
};

function moveButtonAway(clientX, clientY) {
  const rect = yesBtn.getBoundingClientRect();
  const buttonCenterX = rect.left + rect.width / 2;
  const buttonCenterY = rect.top + rect.height / 2;
  
  const distance = Math.sqrt(
    Math.pow(clientX - buttonCenterX, 2) + 
    Math.pow(clientY - buttonCenterY, 2)
  );
  
  if (distance < 100) {
    const angle = Math.atan2(buttonCenterY - clientY, buttonCenterX - clientX);
    const distance = 120;
    const newX = buttonCenterX + Math.cos(angle) * distance;
    const newY = buttonCenterY + Math.sin(angle) * distance;
    
    yesBtn.style.position = 'fixed';
    yesBtn.style.left = Math.max(10, Math.min(newX - rect.width / 2, window.innerWidth - rect.width - 10)) + 'px';
    yesBtn.style.top = Math.max(10, Math.min(newY - rect.height / 2, window.innerHeight - rect.height - 10)) + 'px';
    yesBtn.style.zIndex = '1000';
  }
}

// Mouse move for desktop
document.addEventListener('mousemove', (e) => {
  if (!isTouchDevice()) {
    moveButtonAway(e.clientX, e.clientY);
  }
});

// Touch move for mobile
document.addEventListener('touchmove', (e) => {
  if (e.touches.length > 0) {
    moveButtonAway(e.touches[0].clientX, e.touches[0].clientY);
  }
});

yesBtn.addEventListener('click', (e) => {
  e.preventDefault();
  clickCount++;
  const idx = Math.min(clickCount - 1, funMessages.length - 1);
  message.textContent = funMessages[idx];
});

noBtn.addEventListener('click', () => {
  message.textContent = "We'll miss you! 😢";
  setTimeout(() => {
    noBtn.textContent = "Thanks for being honest!";
    noBtn.disabled = true;
    noBtn.style.opacity = '0.6';
  }, 500);
});

noBtn.addEventListener('mouseenter', () => {
  noBtn.style.background = '#4a4a4a';
});

noBtn.addEventListener('mouseleave', () => {
  noBtn.style.background = '#3a3a3a';
});
</script>
